name: RAM PLAYER v23.0 Compact 20MB - Build & Verify APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ram-player-v23-compact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract v23.0 Compact ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*v23*COMPACT*.zip' -print | sort -V | tail -n 1)"
          if [[ -z "${ZIP_FILE}" ]]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print | sort -V | tail -n 1)"
          fi
          if [[ -n "${ZIP_FILE}" ]]; then
            echo "Found source archive: ${ZIP_FILE}"
            EXTRACT_DIR="${RUNNER_TEMP}/ram-player-v23-source"
            rm -rf "${EXTRACT_DIR}"
            mkdir -p "${EXTRACT_DIR}"
            unzip -q -o "${ZIP_FILE}" -d "${EXTRACT_DIR}"
            SETTINGS_FILE="$(find "${EXTRACT_DIR}" -type f -name settings.gradle.kts -print -quit)"
            PROJECT_DIR="$(dirname "${SETTINGS_FILE}")"
            cp -a "${PROJECT_DIR}/." "${GITHUB_WORKSPACE}/"
            test -f settings.gradle.kts
            test -f app/build.gradle.kts
          else
            echo "::error::No source ZIP found."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK and install SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="${SDK_ROOT}"
          export ANDROID_SDK_ROOT="${SDK_ROOT}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "sdk.dir=${SDK_ROOT}" > local.properties
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null || true
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify project structure & run all unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_project.py
          gradle --no-daemon --no-configuration-cache testDebugUnitTest --console=plain

      - name: Build Compact Split Release APKs (~18-20 MB each)
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache assembleRelease --console=plain
          mkdir -p compact_apks
          ARMV7_APK="$(find app/build/outputs/apk/release -type f -name '*armeabi-v7a*.apk' ! -name '*-unsigned.apk' -print -quit)"
          ARM64_APK="$(find app/build/outputs/apk/release -type f -name '*arm64-v8a*.apk' ! -name '*-unsigned.apk' -print -quit)"
          if [[ -n "${ARMV7_APK}" && -s "${ARMV7_APK}" ]]; then
            unzip -t "${ARMV7_APK}" >/dev/null
            cp "${ARMV7_APK}" compact_apks/RAM-PLAYER-v23.0-ARMv7-TV-Compact.apk
          fi
          if [[ -n "${ARM64_APK}" && -s "${ARM64_APK}" ]]; then
            unzip -t "${ARM64_APK}" >/dev/null
            cp "${ARM64_APK}" compact_apks/RAM-PLAYER-v23.0-ARM64-Phone-TV-Compact.apk
          fi
          ls -lh compact_apks/

      - name: Upload ARMv7 Compact APK (~18 MB for 32-bit Smart TVs)
        uses: actions/upload-artifact@v4
        with:
          name: RAM-PLAYER-v23.0-ARMv7-TV-Compact
          path: compact_apks/RAM-PLAYER-v23.0-ARMv7-TV-Compact.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ARM64 Compact APK (~20 MB for 64-bit Phones & 4K TVs)
        uses: actions/upload-artifact@v4
        with:
          name: RAM-PLAYER-v23.0-ARM64-Phone-TV-Compact
          path: compact_apks/RAM-PLAYER-v23.0-ARM64-Phone-TV-Compact.apk
          if-no-files-found: error
          retention-days: 14
          
